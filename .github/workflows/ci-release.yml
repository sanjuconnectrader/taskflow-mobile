name: Validate and release Android
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL || 'https://taskflow-backend-ouuj.onrender.com' }}
      FRONTEND_REF: ${{ vars.FRONTEND_REF }}
      APP_VERSION: ${{ github.ref_name }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require configured production approval protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$rules" -gt 0 || { echo "Configure required reviewers on the production environment before production releases."; exit 1; }
      - uses: actions/checkout@v4
      - run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+JSON.parse(require('fs').readFileSync('package.json')).version)throw Error('Version mismatch');if(!/^[a-f0-9]{40}$/.test(process.env.FRONTEND_REF||''))throw Error('Pin FRONTEND_REF');if(!process.env.NEXT_PUBLIC_API_URL?.startsWith('https://'))throw Error('HTTPS API required')"
      - uses: actions/checkout@v4
        with:
          repository: sanjuconnectrader/taskflow-web
          ref: ${{ vars.FRONTEND_REF }}
          path: frontend-source
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm ci && npm test && npm run build
        working-directory: frontend-source
      - run: npm run assets && npm run sync
        env:
          FRONTEND_OUT: frontend-source/out
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          node -e "const [a,b,c]=JSON.parse(require('fs').readFileSync('package.json')).version.split('.').map(Number);if(b>99||c>99||a>2000)throw Error('Version bounds');console.log('ANDROID_VERSION_CODE='+(a*10000+b*100+c))" >> "$GITHUB_ENV"
      - run: chmod +x android/gradlew && npm run build:release
      - name: Verify APK signature
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_SIGNING_CERT_SHA256" || { echo 'Configure the expected Android signing certificate SHA-256.'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > signature.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected=$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test "$actual" = "$expected" || { echo 'Android signing certificate does not match the configured upgrade certificate.'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "TaskFlow $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
